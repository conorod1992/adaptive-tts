name: Apply atomic multi-target override fix

on:
  push:
    branches:
      - fix/atomic-multi-target-overrides-work

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-multi-target-overrides-work

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Apply focused source and regression changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/adaptive_tts/tts.py")
          text = path.read_text(encoding="utf-8")
          marker = "@dataclass(frozen=True, slots=True)\nclass PolicySnapshot:\n"
          if text.count(marker) != 1:
              raise SystemExit("PolicySnapshot marker missing or ambiguous")
          text = text.replace(
              marker,
              "@dataclass(frozen=True, slots=True)\n"
              "class _VoiceOverrideState:\n"
              "    \"\"\"Exact override state used by multi-target transactions.\"\"\"\n\n"
              "    persistent: VoiceOverride | None\n"
              "    next_request: VoiceOverride | None\n\n\n"
              + marker,
              1,
          )

          start = text.index("    async def async_set_voice_override(")
          end = text.index("    def _invalidate_quiet_cache_epoch(", start)
          replacement = '''    def _voice_override_state(self) -> _VoiceOverrideState:
              """Capture exact override state while the override lock is held."""
              return _VoiceOverrideState(
                  persistent=self._persistent_voice_override,
                  next_request=self._next_voice_override,
              )

              def _voice_override_state_with_set(
                  self, override: VoiceOverride, duration: str
              ) -> _VoiceOverrideState:
                  """Build desired Set state without publishing it yet."""
                  current = self._voice_override_state()
                  if duration == DURATION_NEXT_REQUEST:
                      return _VoiceOverrideState(
                          persistent=current.persistent,
                          next_request=VoiceOverride(
                              voice=override.voice,
                              language=override.language,
                              token=secrets.token_hex(8),
                          ),
                      )
                  return _VoiceOverrideState(
                      persistent=VoiceOverride(
                          voice=override.voice,
                          language=override.language,
                          token=secrets.token_hex(8),
                      ),
                      next_request=current.next_request,
                  )

              def _voice_override_state_with_clear(self, scope: str) -> _VoiceOverrideState:
                  """Build desired Clear state without publishing it yet."""
                  current = self._voice_override_state()
                  return _VoiceOverrideState(
                      persistent=(
                          None
                          if scope in (SCOPE_ALL, SCOPE_PERSISTENT)
                          else current.persistent
                      ),
                      next_request=(
                          None
                          if scope in (SCOPE_ALL, SCOPE_NEXT_REQUEST)
                          else current.next_request
                      ),
                  )

              async def _async_write_persistent_voice_override_locked(
                  self, override: VoiceOverride | None
              ) -> None:
                  """Persist exact state without publishing in-memory state."""
                  if override is None:
                      if self._override_store is not None:
                          await self._override_store.async_remove()
                      return
                  if self._override_store is None:
                      raise HomeAssistantError(
                          "Adaptive TTS voice override storage is unavailable"
                      )
                  await self._override_store.async_save(
                      {
                          "underlying_entity_id": self.underlying_entity_id,
                          "language": override.language,
                          "voice": override.voice,
                          "token": override.token,
                      }
                  )

              def _apply_voice_override_state_locked(
                  self, state: _VoiceOverrideState
              ) -> None:
                  """Publish a fully prepared override state without awaiting."""
                  self._persistent_voice_override = state.persistent
                  self._next_voice_override = state.next_request

              async def async_set_voice_override(
                  self, language: str | None, voice: str, duration: str
              ) -> None:
                  """Set a one-shot or persistent voice override."""
                  override = self.validate_voice_override(language, voice)
                  if duration not in (DURATION_NEXT_REQUEST, DURATION_UNTIL_CHANGED):
                      raise HomeAssistantError(
                          f"Unsupported voice override duration: {duration}"
                      )

                  async with self._override_lock:
                      original = self._voice_override_state()
                      desired = self._voice_override_state_with_set(override, duration)
                      if original.persistent != desired.persistent:
                          await self._async_write_persistent_voice_override_locked(
                              desired.persistent
                          )
                      self._apply_voice_override_state_locked(desired)

              async def async_clear_voice_override(self, scope: str = SCOPE_ALL) -> None:
                  """Clear one-shot and/or persistent voice overrides."""
                  if scope not in (SCOPE_ALL, SCOPE_NEXT_REQUEST, SCOPE_PERSISTENT):
                      raise HomeAssistantError(
                          f"Unsupported voice override scope: {scope}"
                      )

                  async with self._override_lock:
                      original = self._voice_override_state()
                      desired = self._voice_override_state_with_clear(scope)
                      if original.persistent != desired.persistent:
                          await self._async_write_persistent_voice_override_locked(
                              desired.persistent
                          )
                      self._apply_voice_override_state_locked(desired)

          '''
          # The YAML indentation becomes part of the Python literal; normalize only
          # the common extra indentation introduced inside this heredoc.
          replacement = replacement.replace("\n              ", "\n    ")
          replacement = replacement.replace("\n                  ", "\n        ")
          replacement = replacement.replace("\n                      ", "\n            ")
          replacement = replacement.replace("\n                          ", "\n                ")
          replacement = replacement.replace("\n                              ", "\n                    ")
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")

          Path("custom_components/adaptive_tts/services.py").write_text('''"""Service actions for Adaptive TTS."""

          from __future__ import annotations

          import logging
          from collections.abc import Iterable
          from contextlib import AsyncExitStack

          import voluptuous as vol
          from homeassistant.const import ATTR_ENTITY_ID
          from homeassistant.core import HomeAssistant, ServiceCall
          from homeassistant.exceptions import HomeAssistantError, ServiceValidationError
          from homeassistant.helpers import config_validation as cv
          from homeassistant.helpers import entity_registry as er

          from .const import (
              ATTR_DURATION,
              ATTR_LANGUAGE,
              ATTR_SCOPE,
              ATTR_VOICE,
              DATA_ENTITIES,
              DOMAIN,
              DURATION_NEXT_REQUEST,
              DURATION_UNTIL_CHANGED,
              SCOPE_ALL,
              SCOPE_NEXT_REQUEST,
              SCOPE_PERSISTENT,
              SERVICE_CLEAR_VOICE_OVERRIDE,
              SERVICE_SET_VOICE_OVERRIDE,
          )

          _LOGGER = logging.getLogger(__name__)

          _SET_SCHEMA = vol.Schema(
              {
                  vol.Required(ATTR_ENTITY_ID): cv.entity_ids,
                  vol.Required(ATTR_LANGUAGE): cv.string,
                  vol.Required(ATTR_VOICE): cv.string,
                  vol.Optional(ATTR_DURATION, default=DURATION_NEXT_REQUEST): vol.In(
                      (DURATION_NEXT_REQUEST, DURATION_UNTIL_CHANGED)
                  ),
              }
          )

          _CLEAR_SCHEMA = vol.Schema(
              {
                  vol.Required(ATTR_ENTITY_ID): cv.entity_ids,
                  vol.Optional(ATTR_SCOPE, default=SCOPE_ALL): vol.In(
                      (SCOPE_ALL, SCOPE_NEXT_REQUEST, SCOPE_PERSISTENT)
                  ),
              }
          )


          def _resolve_entities(hass: HomeAssistant, entity_ids: Iterable[str]):
              """Resolve targeted Adaptive TTS entities, including renamed entities."""
              registry = er.async_get(hass)
              entities_by_entry = hass.data[DOMAIN][DATA_ENTITIES]
              resolved = []
              missing = []

              for entity_id in entity_ids:
                  registry_entry = registry.async_get(entity_id)
                  entity = None
                  if (
                      registry_entry is not None
                      and registry_entry.platform == DOMAIN
                      and registry_entry.config_entry_id is not None
                  ):
                      entity = entities_by_entry.get(registry_entry.config_entry_id)
                  if entity is None:
                      entity = next(
                          (
                              candidate
                              for candidate in entities_by_entry.values()
                              if getattr(candidate, "entity_id", None) == entity_id
                          ),
                          None,
                      )
                  if entity is None:
                      missing.append(entity_id)
                  else:
                      resolved.append(entity)

              if missing:
                  raise ServiceValidationError(
                      "Not an available Adaptive TTS entity: " + ", ".join(missing)
                  )
              return resolved


          def _validate_voice_override_targets(entities, language: str, voice: str) -> None:
              """Validate all targets before mutating any target."""
              for entity in entities:
                  entity.validate_voice_override(language, voice)


          def _unique_entities(entities):
              """Deduplicate targets by identity while preserving caller order."""
              unique = []
              seen = set()
              for entity in entities:
                  identity = id(entity)
                  if identity in seen:
                      continue
                  seen.add(identity)
                  unique.append(entity)
              return unique


          def _entity_label(entity) -> str:
              """Return a stable label for rollback diagnostics."""
              return getattr(entity, "entity_id", None) or getattr(
                  getattr(entity, "_entry", None), "entry_id", "unknown"
              )


          async def _async_commit_override_states(states) -> None:
              """Persist all targets, roll back on failure, then publish states."""
              attempted = []
              try:
                  for entity, original, desired in states:
                      if original.persistent == desired.persistent:
                          continue
                      attempted.append((entity, original))
                      await entity._async_write_persistent_voice_override_locked(
                          desired.persistent
                      )
              except BaseException as err:
                  rollback_failures = []
                  for entity, original in reversed(attempted):
                      try:
                          await entity._async_write_persistent_voice_override_locked(
                              original.persistent
                          )
                      except Exception as rollback_err:
                          label = _entity_label(entity)
                          rollback_failures.append(label)
                          _LOGGER.error(
                              "Failed to roll back voice override storage for %s: %s",
                              label,
                              rollback_err,
                          )
                  if rollback_failures and isinstance(err, Exception):
                      raise HomeAssistantError(
                          "Voice override update failed and rollback was incomplete for: "
                          + ", ".join(rollback_failures)
                      ) from err
                  raise

              for entity, _original, desired in states:
                  entity._apply_voice_override_state_locked(desired)


          async def _async_set_voice_override_targets(
              entities, language: str, voice: str, duration: str
          ) -> None:
              """Apply one Set override action atomically across all targets."""
              entities = _unique_entities(entities)
              _validate_voice_override_targets(entities, language, voice)
              async with AsyncExitStack() as stack:
                  for entity in sorted(entities, key=id):
                      await stack.enter_async_context(entity._override_lock)

                  validated = [
                      entity.validate_voice_override(language, voice) for entity in entities
                  ]
                  states = []
                  for entity, override in zip(entities, validated, strict=True):
                      original = entity._voice_override_state()
                      desired = entity._voice_override_state_with_set(override, duration)
                      states.append((entity, original, desired))
                  await _async_commit_override_states(states)


          async def _async_clear_voice_override_targets(entities, scope: str) -> None:
              """Apply one Clear override action atomically across all targets."""
              entities = _unique_entities(entities)
              async with AsyncExitStack() as stack:
                  for entity in sorted(entities, key=id):
                      await stack.enter_async_context(entity._override_lock)

                  states = []
                  for entity in entities:
                      original = entity._voice_override_state()
                      desired = entity._voice_override_state_with_clear(scope)
                      states.append((entity, original, desired))
                  await _async_commit_override_states(states)


          def async_register_services(hass: HomeAssistant) -> None:
              """Register Adaptive TTS actions."""

              async def _set_voice_override(call: ServiceCall) -> None:
                  entities = _resolve_entities(hass, call.data[ATTR_ENTITY_ID])
                  await _async_set_voice_override_targets(
                      entities,
                      call.data[ATTR_LANGUAGE],
                      call.data[ATTR_VOICE],
                      call.data[ATTR_DURATION],
                  )

              async def _clear_voice_override(call: ServiceCall) -> None:
                  entities = _resolve_entities(hass, call.data[ATTR_ENTITY_ID])
                  await _async_clear_voice_override_targets(entities, call.data[ATTR_SCOPE])

              hass.services.async_register(
                  DOMAIN,
                  SERVICE_SET_VOICE_OVERRIDE,
                  _set_voice_override,
                  schema=_SET_SCHEMA,
              )
              hass.services.async_register(
                  DOMAIN,
                  SERVICE_CLEAR_VOICE_OVERRIDE,
                  _clear_voice_override,
                  schema=_CLEAR_SCHEMA,
              )
          '''.replace("\n          ", "\n"), encoding="utf-8")

          Path("tests/test_service_transactions.py").write_text('''"""Regression tests for atomic multi-target override services."""

          from unittest.mock import patch

          import pytest

          from custom_components.adaptive_tts.const import (
              DURATION_UNTIL_CHANGED,
              SCOPE_ALL,
          )
          from custom_components.adaptive_tts.services import (
              _async_clear_voice_override_targets,
              _async_set_voice_override_targets,
          )
          from custom_components.adaptive_tts.tts import AdaptiveTTSEntity, VoiceOverride

          from .test_backend_robustness import attach, make_entry
          from .test_tts import MockTTS


          class _TransactionalStore:
              """Store stub that can fail after a partial persistent write."""

              def __init__(self, data, *, fail_save_voice=None, fail_remove=False):
                  self.data = dict(data) if data is not None else None
                  self.fail_save_voice = fail_save_voice
                  self.fail_remove = fail_remove

              async def async_save(self, data):
                  self.data = dict(data)
                  if self.fail_save_voice == data.get("voice"):
                      self.fail_save_voice = None
                      raise RuntimeError("simulated save failure")

              async def async_remove(self):
                  self.data = None
                  if self.fail_remove:
                      self.fail_remove = False
                      raise RuntimeError("simulated remove failure")


          def _stored_override(entity, override):
              return {
                  "underlying_entity_id": entity.underlying_entity_id,
                  "language": override.language,
                  "voice": override.voice,
                  "token": override.token,
              }


          def _seed_state(entity, persistent, next_request, store):
              entity._persistent_voice_override = persistent
              entity._next_voice_override = next_request
              entity._override_store = store


          @pytest.mark.asyncio
          async def test_persistent_set_rolls_back_partial_multi_target_write(hass) -> None:
              """A later Set failure restores every attempted target exactly."""
              source = MockTTS()
              first = AdaptiveTTSEntity(make_entry(entry_id="first"))
              second = AdaptiveTTSEntity(make_entry(entry_id="second"))
              attach(first, hass, source)
              attach(second, hass, source)
              old_first = VoiceOverride("normal", "en-US", "persist-first")
              old_second = VoiceOverride("normal", "en-US", "persist-second")
              next_first = VoiceOverride("whisper", "en-US", "next-first")
              next_second = VoiceOverride("whisper", "en-US", "next-second")
              first_store = _TransactionalStore(_stored_override(first, old_first))
              second_store = _TransactionalStore(
                  _stored_override(second, old_second), fail_save_voice="whisper"
              )
              _seed_state(first, old_first, next_first, first_store)
              _seed_state(second, old_second, next_second, second_store)

              with (
                  patch(
                      "custom_components.adaptive_tts.tts.get_tts_entity",
                      return_value=source,
                  ),
                  pytest.raises(RuntimeError, match="simulated save failure"),
              ):
                  await _async_set_voice_override_targets(
                      [first, second], "en-US", "whisper", DURATION_UNTIL_CHANGED
                  )

              assert first.persistent_voice_override == old_first
              assert second.persistent_voice_override == old_second
              assert first.next_voice_override == next_first
              assert second.next_voice_override == next_second
              assert first_store.data == _stored_override(first, old_first)
              assert second_store.data == _stored_override(second, old_second)


          @pytest.mark.asyncio
          async def test_clear_rolls_back_partial_multi_target_write(hass) -> None:
              """A later Clear failure restores persistent and one-shot state exactly."""
              first = AdaptiveTTSEntity(make_entry(entry_id="first"))
              second = AdaptiveTTSEntity(make_entry(entry_id="second"))
              old_first = VoiceOverride("normal", "en-US", "persist-first")
              old_second = VoiceOverride("normal", "en-US", "persist-second")
              next_first = VoiceOverride("whisper", "en-US", "next-first")
              next_second = VoiceOverride("whisper", "en-US", "next-second")
              first_store = _TransactionalStore(_stored_override(first, old_first))
              second_store = _TransactionalStore(
                  _stored_override(second, old_second), fail_remove=True
              )
              _seed_state(first, old_first, next_first, first_store)
              _seed_state(second, old_second, next_second, second_store)

              with pytest.raises(RuntimeError, match="simulated remove failure"):
                  await _async_clear_voice_override_targets([first, second], SCOPE_ALL)

              assert first.persistent_voice_override == old_first
              assert second.persistent_voice_override == old_second
              assert first.next_voice_override == next_first
              assert second.next_voice_override == next_second
              assert first_store.data == _stored_override(first, old_first)
              assert second_store.data == _stored_override(second, old_second)


          @pytest.mark.asyncio
          async def test_persistent_set_commits_all_targets_after_storage_succeeds(hass) -> None:
              """Successful multi-target Set publishes every prepared state."""
              source = MockTTS()
              first = AdaptiveTTSEntity(make_entry(entry_id="first"))
              second = AdaptiveTTSEntity(make_entry(entry_id="second"))
              attach(first, hass, source)
              attach(second, hass, source)
              first._override_store = _TransactionalStore(None)
              second._override_store = _TransactionalStore(None)

              with patch(
                  "custom_components.adaptive_tts.tts.get_tts_entity",
                  return_value=source,
              ):
                  await _async_set_voice_override_targets(
                      [first, second], "en-US", "whisper", DURATION_UNTIL_CHANGED
                  )

              assert first.persistent_voice_override is not None
              assert second.persistent_voice_override is not None
              assert first.persistent_voice_override.voice == "whisper"
              assert second.persistent_voice_override.voice == "whisper"
              assert first._override_store.data["token"] == first.persistent_voice_override.token
              assert second._override_store.data["token"] == second.persistent_voice_override.token
          '''.replace("\n          ", "\n"), encoding="utf-8")

          for filename in (
              "custom_components/adaptive_tts/const.py",
              "custom_components/adaptive_tts/manifest.json",
          ):
              version_path = Path(filename)
              version_text = version_path.read_text(encoding="utf-8")
              if version_text.count("0.2.11") != 1:
                  raise SystemExit(f"Unexpected version occurrences in {filename}")
              version_path.write_text(
                  version_text.replace("0.2.11", "0.2.12", 1), encoding="utf-8"
              )

          Path(".github/workflows/apply-atomic-multi-target-overrides.yml").unlink()
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Format and validate
        run: |
          python -m ruff format custom_components/adaptive_tts/tts.py custom_components/adaptive_tts/services.py tests/test_service_transactions.py
          node --test tests/frontend.test.mjs
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make multi-target voice overrides atomic"
          git push origin HEAD:fix/atomic-multi-target-overrides-work

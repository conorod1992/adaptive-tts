name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest tests
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  real-ha:
    name: real-ha (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements_real_ha.txt
      - run: python scripts/install_real_ha_component_requirements.py
      - name: Show Home Assistant version
        run: python -c "from homeassistant.const import __version__; print(__version__)"
      - run: python -m pytest tests_real_ha

  real-ha-upcoming:
    name: real-ha (upcoming)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve upcoming Home Assistant Python version
        id: ha-python
        shell: bash
        run: |
          PYTHON_VERSION="$(curl -fsSL https://raw.githubusercontent.com/home-assistant/core/dev/.python-version | tr -d '\n')"
          test -n "$PYTHON_VERSION"
          echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "Home Assistant dev Python version: $PYTHON_VERSION"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.ha-python.outputs.version }}
          allow-prereleases: true
          cache: pip
      - name: Install latest HA test environment
        run: python -m pip install --upgrade -r requirements_real_ha_upcoming.txt
      - name: Install upcoming Home Assistant Core dev
        run: |
          python -m pip install --upgrade --force-reinstall \
            "git+https://github.com/home-assistant/core.git@dev"
      - run: python scripts/install_real_ha_component_requirements.py
      - name: Show upcoming Home Assistant version
        run: |
          python - <<'PY'
          from importlib.metadata import version

          print("Home Assistant " + version("homeassistant"))
          print(
              "pytest-homeassistant-custom-component "
              + version("pytest-homeassistant-custom-component")
          )
          PY
      - name: Run Real HA acceptance tests against upcoming HA
        run: python -m pytest tests_real_ha

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

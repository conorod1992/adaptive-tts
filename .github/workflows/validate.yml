name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest tests
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  real-ha:
    name: real-ha (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements_real_ha.txt
      - run: python scripts/install_real_ha_component_requirements.py
      - name: Show Home Assistant version
        run: python -c "from homeassistant.const import __version__; print(__version__)"
      - run: python -m pytest tests_real_ha

  real-ha-upcoming:
    name: real-ha (upcoming)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install latest HA test environment
        run: python -m pip install --upgrade -r requirements_real_ha_upcoming.txt
      - run: python scripts/install_real_ha_component_requirements.py
      - name: Detect upcoming Home Assistant release
        id: upcoming
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from homeassistant.const import __version__
          from packaging.version import Version

          version = Version(__version__)
          print(f"ha_version={version}")
          print(f"run={'true' if version.is_prerelease else 'false'}")
          PY
      - name: Show upcoming Home Assistant version
        run: echo "Home Assistant ${{ steps.upcoming.outputs.ha_version }}"
      - name: Run Real HA acceptance tests against upcoming HA
        if: steps.upcoming.outputs.run == 'true'
        run: python -m pytest tests_real_ha
      - name: No upcoming HA prerelease available
        if: steps.upcoming.outputs.run != 'true'
        run: echo "Latest pytest-homeassistant-custom-component targets stable HA; no newer prerelease is currently available, so the upcoming lane is skipped."

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

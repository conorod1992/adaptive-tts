name: Apply preview override recovery rebase v2

on:
  push:
    branches:
      - fix/preflight-recovery-rebase

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preflight-recovery-rebase

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Apply recovery hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}; found {count}")
              return text.replace(old, new, 1)

          tts_path = Path("custom_components/adaptive_tts/tts.py")
          tts = tts_path.read_text()
          start = tts.index("    @callback\n    def resolve_request(")
          end = tts.index("\n\n    async def _async_resolve_for_synthesis(", start)
          existing = tts[start:end]
          method = dedent('''
              async def async_resolve_request_for_preflight(
                  self,
                  language: str | None,
                  options: Mapping[str, Any] | None,
              ) -> ResolvedRequest:
                  """Resolve without consuming a valid one-shot, but recover failed overrides."""
                  snapshot = self._policy_snapshot_from_options(options)
                  request_override = self._override_from_snapshot(snapshot)
                  request_scope = (
                      snapshot.override_scope if request_override is not None else None
                  )
                  try:
                      return self._resolve_request_with_snapshot(language, options, snapshot)
                  except Exception:
                      await self._async_clear_failed_voice_override(
                          request_override, request_scope
                      )
                      raise
          ''').strip()
          method = "\n".join("    " + line if line else line for line in method.splitlines())
          tts_path.write_text(tts[:start] + existing + "\n\n" + method + tts[end:])

          preview_path = Path("custom_components/adaptive_tts/preview.py")
          preview = preview_path.read_text()
          preview_path.write_text(
              replace_once(
                  preview,
                  "            resolved = engine.resolve_request(stream.language, stream.options)\n",
                  "            resolved = await engine.async_resolve_request_for_preflight(\n"
                  "                stream.language, stream.options\n"
                  "            )\n",
                  "Adaptive TTS preview resolution",
              )
          )

          const_path = Path("custom_components/adaptive_tts/const.py")
          const = const_path.read_text()
          const_path.write_text(
              replace_once(
                  const,
                  'VERSION: Final = "0.2.8"',
                  'VERSION: Final = "0.2.9"',
                  "runtime version",
              )
          )

          manifest_path = Path("custom_components/adaptive_tts/manifest.json")
          manifest = manifest_path.read_text()
          manifest_path.write_text(
              replace_once(
                  manifest,
                  '"version": "0.2.8"',
                  '"version": "0.2.9"',
                  "manifest version",
              )
          )

          test_path = Path("tests/test_preview_override_recovery.py")
          if test_path.exists():
              raise SystemExit("preview override recovery test file already exists")
          test_path.write_text(dedent('''
              """Regression tests for Adaptive TTS preview override recovery."""

              from unittest.mock import patch

              import pytest
              from homeassistant.exceptions import HomeAssistantError

              from custom_components.adaptive_tts.const import (
                  CACHE_POLICY_OPTION,
                  DURATION_NEXT_REQUEST,
                  DURATION_UNTIL_CHANGED,
              )
              from custom_components.adaptive_tts.preview import create_preview
              from custom_components.adaptive_tts.tts import AdaptiveTTSEntity

              from .test_voice_overrides import OverrideTTS, attach, make_entry


              @pytest.mark.asyncio
              async def test_successful_preview_preflight_keeps_next_request_override(hass) -> None:
                  """A valid preview preflight must not consume a pending one-shot override."""
                  source = OverrideTTS()
                  entity = AdaptiveTTSEntity(make_entry())
                  attach(entity, hass, source)

                  with patch(
                      "custom_components.adaptive_tts.tts.get_tts_entity", return_value=source
                  ):
                      await entity.async_set_voice_override(
                          "en-GB", "cheerful-gb", DURATION_NEXT_REQUEST
                      )
                      policy = entity.default_options[CACHE_POLICY_OPTION]
                      resolved = await entity.async_resolve_request_for_preflight(
                          "en-US", {CACHE_POLICY_OPTION: policy}
                      )

                  assert resolved.language == "en-GB"
                  assert resolved.options["voice"] == "cheerful-gb"
                  assert entity.next_voice_override is not None


              @pytest.mark.asyncio
              async def test_failed_preflight_clears_invalid_next_request_override(hass) -> None:
                  """A one-shot override rejected by preflight must not poison later requests."""
                  source = OverrideTTS()
                  entity = AdaptiveTTSEntity(make_entry())
                  attach(entity, hass, source)

                  with patch(
                      "custom_components.adaptive_tts.tts.get_tts_entity", return_value=source
                  ):
                      await entity.async_set_voice_override(
                          "en-GB", "cheerful-gb", DURATION_NEXT_REQUEST
                      )
                      policy = entity.default_options[CACHE_POLICY_OPTION]

                  original_get_voices = source.async_get_supported_voices

                  def without_one_shot_voice(language):
                      voices = original_get_voices(language)
                      if language != "en-GB" or voices is None:
                          return voices
                      return [voice for voice in voices if voice.voice_id != "cheerful-gb"]

                  source.async_get_supported_voices = without_one_shot_voice
                  with (
                      patch(
                          "custom_components.adaptive_tts.tts.get_tts_entity",
                          return_value=source,
                      ),
                      pytest.raises(HomeAssistantError, match="cheerful-gb"),
                  ):
                      await entity.async_resolve_request_for_preflight(
                          "en-US", {CACHE_POLICY_OPTION: policy}
                      )

                  assert entity.next_voice_override is None


              class _PreflightStream:
                  """Minimal result stream whose synthesis should never start."""

                  url = "/api/tts_proxy/preflight.mp3"
                  extension = "mp3"
                  language = "en-US"

                  def __init__(self, options) -> None:
                      self.options = options
                      self.deleted = False
                      self.message_stream = None

                  def async_set_message_stream(self, message_stream) -> None:
                      self.message_stream = message_stream

                  async def async_stream_result(self):
                      raise AssertionError(
                          "preview synthesis should not start after failed preflight"
                      )
                      yield b""  # pragma: no cover

                  def delete(self) -> None:
                      self.deleted = True


              @pytest.mark.asyncio
              async def test_preview_preflight_clears_stale_persistent_override(
                  hass, tmp_path
              ) -> None:
                  """TTS Test clears a persistent voice rejected during its own preflight."""
                  hass.config.config_dir = str(tmp_path)
                  source = OverrideTTS()
                  entry = make_entry()
                  entity = AdaptiveTTSEntity(entry)
                  attach(entity, hass, source)
                  await entity.async_load_voice_override(hass)

                  with patch(
                      "custom_components.adaptive_tts.tts.get_tts_entity", return_value=source
                  ):
                      await entity.async_set_voice_override(
                          "en-GB", "cheerful-gb", DURATION_UNTIL_CHANGED
                      )
                      policy = entity.default_options[CACHE_POLICY_OPTION]

                  original_get_voices = source.async_get_supported_voices

                  def without_persistent_voice(language):
                      voices = original_get_voices(language)
                      if language != "en-GB" or voices is None:
                          return voices
                      return [voice for voice in voices if voice.voice_id != "cheerful-gb"]

                  source.async_get_supported_voices = without_persistent_voice
                  stream = _PreflightStream({CACHE_POLICY_OPTION: policy})

                  with (
                      patch(
                          "custom_components.adaptive_tts.preview.tts.async_create_stream",
                          return_value=stream,
                      ),
                      patch(
                          "custom_components.adaptive_tts.preview.get_engine_instance",
                          return_value=entity,
                      ),
                      patch(
                          "custom_components.adaptive_tts.tts.get_tts_entity",
                          return_value=source,
                      ),
                      pytest.raises(HomeAssistantError, match="cheerful-gb"),
                  ):
                      await create_preview(
                          hass,
                          {
                              "engine_id": "tts.adaptive",
                              "language": "en-US",
                              "options": {},
                              "message": "Preview",
                          },
                      )

                  assert stream.deleted is True
                  assert entity.persistent_voice_override is None

                  reloaded = AdaptiveTTSEntity(entry)
                  reloaded.hass = hass
                  await reloaded.async_load_voice_override(hass)
                  assert reloaded.persistent_voice_override is None
          ''').lstrip())

          for helper in (
              ".github/workflows/apply-preflight-recovery-rebase.yml",
              ".github/workflows/apply-preflight-recovery-rebase-v2.yml",
          ):
              helper_path = Path(helper)
              if helper_path.exists():
                  helper_path.unlink()
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Format Python changes
        run: python -m ruff format custom_components/adaptive_tts/tts.py custom_components/adaptive_tts/preview.py tests/test_preview_override_recovery.py

      - name: Run validation
        run: |
          node --test tests/frontend.test.mjs
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover stale overrides during preview preflight"
          git push origin HEAD:fix/preflight-recovery-rebase
